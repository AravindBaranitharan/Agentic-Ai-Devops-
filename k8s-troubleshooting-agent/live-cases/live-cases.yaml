# Real-time LIVE failure cases for the Kubernetes Troubleshooting Agent.
#
# These are REAL workloads that genuinely break on a real cluster — the agent reads
# them live via the Kubernetes API. Nothing here is hard-coded in the app.
#
#   kubectl apply -f live-cases.yaml
#   # give it ~60s to reach steady failure states, then run the agent
#
# Namespaces: `shop` (product workloads) and `platform` (shared services).
---
apiVersion: v1
kind: Namespace
metadata: { name: shop }
---
apiVersion: v1
kind: Namespace
metadata: { name: platform }
# ─────────────────────────────────────────────────────────────────────────────
# 1 · CrashLoopBackOff — the app exits on boot because a required env var is missing.
#     (Real crash: the container `exit 1`s when DATABASE_URL is empty.)
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: checkout, namespace: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: checkout } }
  template:
    metadata: { labels: { app: checkout } }
    spec:
      containers:
        - name: checkout
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting checkout service v2.3.1"
              echo "Reading config from \$DATABASE_URL"
              if [ -z "$DATABASE_URL" ]; then
                echo "panic: DATABASE_URL is empty — cannot connect to Postgres" >&2
                exit 1
              fi
              sleep 3600
          # DATABASE_URL intentionally NOT set → boot crash → CrashLoopBackOff
# ─────────────────────────────────────────────────────────────────────────────
# 2 · ImagePullBackOff — the image tag does not exist in the registry.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: recommender, namespace: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: recommender } }
  template:
    metadata: { labels: { app: recommender } }
    spec:
      containers:
        - name: recommender
          image: ghcr.io/does-not-exist/recommender:v9.9.9   # no such image/tag
# ─────────────────────────────────────────────────────────────────────────────
# 3 · OOMKilled — the container allocates far more than its memory limit.
#     (Real OOM: busybox writes ~250MB into a tmpfs capped by a 64Mi limit.)
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: image-resizer, namespace: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: image-resizer } }
  template:
    metadata: { labels: { app: image-resizer } }
    spec:
      containers:
        - name: resizer
          image: polinux/stress          # canonical k8s OOM demo image
          resources:
            requests: { memory: "100Mi" }
            limits:   { memory: "150Mi" }         # too small for the 250M allocation below
          command: ["stress"]
          # allocate 250MB of heap → exceeds the 150Mi limit → OOMKilled (exit 137) AFTER it starts
          args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "1"]
# ─────────────────────────────────────────────────────────────────────────────
# 4 · Unschedulable (Pending) — requests more CPU than any node can provide.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: batch-nightly, namespace: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: batch-nightly } }
  template:
    metadata: { labels: { app: batch-nightly } }
    spec:
      containers:
        - name: batch
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: { cpu: "64" }               # 64 cores → no node fits it
# ─────────────────────────────────────────────────────────────────────────────
# 5 · Healthy control — should stay Running/Ready.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
# ─────────────────────────────────────────────────────────────────────────────
# 6 · Readiness probe failing — the pod runs but never becomes Ready.
#     (Real probe failure: readiness hits /ready, which does not exist → 404/connection refused.)
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payments-api, namespace: platform }
spec:
  replicas: 1
  selector: { matchLabels: { app: payments-api } }
  template:
    metadata: { labels: { app: payments-api } }
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine     # serves / but not /ready
          readinessProbe:
            httpGet: { path: /ready, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
# ─────────────────────────────────────────────────────────────────────────────
# 7 · CreateContainerConfigError — envFrom references a Secret that does not exist.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: notifier, namespace: platform }
spec:
  replicas: 1
  selector: { matchLabels: { app: notifier } }
  template:
    metadata: { labels: { app: notifier } }
    spec:
      containers:
        - name: notifier
          image: busybox:1.36
          command: ["sleep", "3600"]
          envFrom:
            - secretRef: { name: smtp-credentials }   # this Secret is never created
